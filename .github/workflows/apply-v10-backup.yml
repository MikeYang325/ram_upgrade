name: Apply V10 backup UI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v10-backup.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ram-backup-ui-refresh
          fetch-depth: 0
      - name: Build clean V10 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('123.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<style>.*?</style>', '<link rel="stylesheet" href="v10.css">', text, count=1, flags=re.S)
          p.write_text(text, encoding='utf-8')
          Path('index.html').write_text(text, encoding='utf-8')
          PY
      - name: Commit backup build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 123.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build clean V10 backup UI [skip ci]"
          git push origin HEAD:ram-backup-ui-refresh
