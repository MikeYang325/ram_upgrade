name: Enable EdgeOne HTTPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  https:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Enable HTTPS automatically'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Apply free HTTPS certificates
        shell: bash
        run: |
          set -euo pipefail
          API='https://pages-api.edgeone.ai/v1'
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"

          raw_api() {
            curl -sS "$API" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
              --data-binary "$1"
          }

          wait_domain() {
            local pid="$1" domain="$2" out zone
            for _ in $(seq 1 120); do
              out="$(raw_api "$(jq -nc --arg pid "$pid" --arg d "$domain" '{Action:"DescribePagesZoneCustomDomains",ProjectId:$pid,Domain:$d}')")"
              if jq -e '(.Code == 0) and ((.Data.Response.Error? // null) == null) and ((.Data.Response.Domain? // "") != "")' >/dev/null <<<"$out"; then
                zone="$(jq -r '.Data.Response.ZoneId // empty' <<<"$out")"
                if [ -n "$zone" ]; then
                  printf '%s' "$zone"
                  return 0
                fi
              fi
              sleep 15
            done
            echo "$domain is not attached to the target project" >&2
            return 1
          }

          apply_https() {
            local pid="$1" domain="$2" zone out
            zone="$(wait_domain "$pid" "$domain")"
            echo "$domain zone: $zone"
            out="$(raw_api "$(jq -nc --arg zone "$zone" --arg d "$domain" '{Action:"ModifyHostsCertificate",ZoneId:$zone,Hosts:[$d],Mode:"eofreecert"}')")"
            if ! jq -e '(.Code == 0) and ((.Data.Response.Error? // null) == null)' >/dev/null <<<"$out"; then
              echo "$domain HTTPS request failed:" >&2
              jq . <<<"$out" >&2 || true
              return 1
            fi
            echo "$domain free HTTPS certificate requested"
          }

          while IFS='|' read -r pid domain; do
            apply_https "$pid" "$domain"
          done <<'DOMAINS'
          makers-fxgtk9g6t5ru|calendar.lovefly.club
          makers-1gm615g3c1pl|666.lovefly.club
          makers-cy3owonuavay|ram.lovefly.club
          makers-o8z6etxne9wi|ca-miles.lovefly.club
          makers-obojyavn3ssu|lovefly.club
          DOMAINS
