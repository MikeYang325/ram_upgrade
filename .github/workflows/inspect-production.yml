name: Inspect production body

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact production headers and body
        run: |
          echo '---HEADERS---'
          curl -LsS -D - -o /tmp/page.html --max-time 20 'https://ram-upgrade.vercel.app/?inspect=headers'
          echo '---BODY META---'
          echo "BYTES=$(wc -c < /tmp/page.html | tr -d ' ')"
          grep -Eo 'https://[^" ]+' /tmp/page.html || true
          echo '---END---'
