name: Inspect production body

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare production endpoints
        run: |
          for URL in \
            'https://ram-upgrade.vercel.app/?inspect=compare' \
            'https://ram-upgrade-mike-yang.vercel.app/?inspect=compare' \
            'https://ram-upgrade-341nnf2fo-mike-yang.vercel.app/?inspect=compare' \
            'https://ram-upgrade-l5yafs4ku-mike-yang.vercel.app/?inspect=compare'
          do
            echo "=== $URL ==="
            code=$(curl -LsS -w '%{http_code}' -o /tmp/page.html --max-time 20 "$URL" || true)
            bytes=$(wc -c < /tmp/page.html 2>/dev/null | tr -d ' ' || echo 0)
            echo "HTTP=$code BYTES=$bytes"
            if grep -q 'V9 — Royal Air Maroc editorial booking tool' /tmp/page.html 2>/dev/null; then echo 'V9=YES'; else echo 'V9=NO'; fi
            if grep -q '正在加载 Safar Flyer' /tmp/page.html 2>/dev/null; then echo 'LOADER=YES'; else echo 'LOADER=NO'; fi
            head -c 120 /tmp/page.html 2>/dev/null || true
            echo
          done
