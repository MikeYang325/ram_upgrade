name: Restore exact uploaded 123

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-exact-123.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact uploaded 123.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');

          const expected = 'f0bad52eadfe2915647fcb9e1a4fd4a40b9c159a28718f0bf4785d70b12d24f8';
          const encoded = [0,1,2,3]
            .map(i => fs.readFileSync(`_exact123/p${i}.b64`, 'utf8'))
            .join('')
            .replace(/\s+/g, '');
          const raw = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const digest = crypto.createHash('sha256').update(raw).digest('hex');

          if (raw.length !== 104651) throw new Error(`size mismatch: ${raw.length}`);
          if (digest !== expected) throw new Error(`sha256 mismatch: ${digest}`);

          fs.writeFileSync('123.html', raw);
          fs.writeFileSync('index.html', raw);
          fs.writeFileSync('vercel.json', JSON.stringify({
            '$schema': 'https://openapi.vercel.sh/vercel.json',
            buildCommand: 'mkdir -p dist && cp 123.html dist/index.html',
            outputDirectory: 'dist',
            cleanUrls: true
          }, null, 2) + '\n');

          const removeFiles = [
            'build.js',
            '.github/workflows/materialize-index.yml',
            '.github/workflows/inspect-production.yml',
            '.github/workflows/verify-production.yml',
            '.github/workflows/restore-exact-123.yml'
          ];
          for (const p of removeFiles) fs.rmSync(p, { force: true });
          for (const p of ['_payload', '_direct123', '_exact123']) {
            fs.rmSync(p, { recursive: true, force: true });
          }

          console.log(`EXACT_123_OK bytes=${raw.length} sha256=${digest}`);
          NODE

      - name: Commit exact original file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'restore: upload exact original 123.html directly'
          git push

      - name: Verify exact production bytes
        shell: bash
        run: |
          EXPECTED='f0bad52eadfe2915647fcb9e1a4fd4a40b9c159a28718f0bf4785d70b12d24f8'
          for i in $(seq 1 40); do
            URL="https://ram-upgrade.vercel.app/?exact123=$(date +%s)-$i"
            echo "Attempt $i: $URL"
            if curl -LfsS --max-time 20 "$URL" -o /tmp/prod.html; then
              BYTES=$(wc -c < /tmp/prod.html | tr -d ' ')
              HASH=$(sha256sum /tmp/prod.html | awk '{print $1}')
              echo "bytes=$BYTES sha256=$HASH"
              if [ "$BYTES" = '104651' ] && [ "$HASH" = "$EXPECTED" ]; then
                echo "PRODUCTION_EXACT_123_OK"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production did not switch to exact 123.html in time.'
          exit 1
