name: Verify production site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/verify-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact Vercel alias and verify repaired static page
        shell: bash
        run: |
          set -u
          URL="https://ram-upgrade.vercel.app/?verify=${GITHUB_SHA}"
          for i in $(seq 1 30); do
            echo "Attempt $i: $URL"
            if curl -LfsS --max-time 15 "$URL" -o /tmp/page.html; then
              bytes=$(wc -c < /tmp/page.html | tr -d ' ')
              echo "Fetched $bytes bytes"
              if [ "$bytes" -gt 100000 ] \
                 && grep -q 'V9 — Royal Air Maroc editorial booking tool' /tmp/page.html \
                 && grep -q 'position:sticky !important' /tmp/page.html \
                 && grep -q 'Royal Air Maroc' /tmp/page.html \
                 && ! grep -q '页面加载失败' /tmp/page.html \
                 && ! grep -q '正在加载 Safar Flyer' /tmp/page.html; then
                echo "PRODUCTION_OK bytes=$bytes"
                exit 0
              fi
              echo 'Exact alias is not on the repaired static deployment yet.'
            fi
            sleep 5
          done
          echo 'Production verification failed after retries.'
          exit 1
