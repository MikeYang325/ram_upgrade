<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safar Flyer Status Optimizer</title>
<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
#boot{padding:24px;color:#222;font-size:14px}
</style>
</head>
<body>
<div id="boot">正在加载 Safar Flyer…</div>
<script>
(async()=>{
  const base='https://cdn.jsdelivr.net/gh/ydx123mike/ram_upgrade@cf69f0943868ac11e3ad5cb3f37b4fbc5c794a3c/_payload/';
  try{
    const [a,b]=await Promise.all([
      fetch(base+'page1.b64').then(r=>{if(!r.ok)throw new Error('payload 1: '+r.status);return r.text()}),
      fetch(base+'page2.b64').then(r=>{if(!r.ok)throw new Error('payload 2: '+r.status);return r.text()})
    ]);
    const encoded=(a+b).replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    let html='';
    if('DecompressionStream' in window){
      try{
        const ds=new DecompressionStream('gzip');
        html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
      }catch(_e){}
    }
    if(!html){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=resolve;
        s.onerror=()=>reject(new Error('gzip fallback 加载失败'));
        document.head.appendChild(s);
      });
      html=new TextDecoder().decode(window.pako.ungzip(bytes));
    }
    if(!html.includes('Safar Flyer')) throw new Error('页面数据校验失败');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    const el=document.getElementById('boot');
    if(el) el.textContent='页面加载失败，请刷新重试：'+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
